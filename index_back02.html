<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-1562828751233160">
    <title>Locaaqui - Avisa</title>
    <meta name="description" content="Estamos trabalhando para melhorar nosso atendimento. Novo sistema em breve.">
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #818cf8;
            --dark: #0f172a;
            --light: #f8fafc;
            --accent: #f472b6;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
        }

        /* Animated Background Gradients */
        .bg-glow {
            position: absolute;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.15) 0%, rgba(15, 23, 42, 0) 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(80px);
            animation: float 20s infinite alternate ease-in-out;
        }

        .glow-1 { top: -10%; left: -10%; }
        .glow-2 { bottom: -10%; right: -10%; animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.1); }
        }

        .container {
            max-width: 600px;
            padding: 2rem;
            animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            margin-bottom: 2rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .logo span {
            color: var(--secondary);
        }

        .illustration-wrapper {
            margin-bottom: 2rem;
            position: relative;
        }

        .main-image {
            width: 100%;
            max-width: 320px;
            height: auto;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.4));
            animation: subtleBounce 4s infinite ease-in-out;
        }

        @keyframes subtleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 {
            font-weight: 800;
            font-size: 2.5rem;
            line-height: 1.1;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 1.25rem;
            color: var(--text-dim);
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(129, 140, 248, 0.1);
            border: 1px border solid rgba(129, 140, 248, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 99px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 1.5rem;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--secondary);
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 10px var(--secondary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(129, 140, 248, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(129, 140, 248, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(129, 140, 248, 0); }
        }

        .apology {
            margin-top: 3rem;
            font-size: 0.9rem;
            color: var(--text-dim);
            font-weight: 400;
            opacity: 0.7;
        }

        .socials {
            margin-top: 2rem;
            display: flex;
            gap: 1.5rem;
            justify-content: center;
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
            p.subtitle { font-size: 1rem; }
            .main-image { max-width: 240px; }
        }
    </style>
</head>
<body>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <main class="container">
        <div class="logo">
            Locaaqui <span>- Avisa</span>
        </div>

        <div class="status-badge">
            <div class="pulse-dot"></div>
            Sistema em Manutenção
        </div>

        <div class="illustration-wrapper">
            <img src="maintenance.png" alt="Trabalhando no sistema" class="main-image">
        </div>

        <h1>Estamos trabalhando em nosso novo sistema</h1>
        
        <p class="subtitle">Estamos trabalhando para melhorar nosso atendimento e trazer uma experiência incrível para você.</p>

        <div class="apology">
            Desculpe o transtorno
        </div>
    </main>
</body>
</html>
